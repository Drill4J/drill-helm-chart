name: publish-helm-chart

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vX.Y.Z or vX.Y.Z-suf.V)'
        default: null

permissions:
  packages: write
  contents: write

concurrency:
  group: publish-helm-chart
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: inputs.version == null
        id: next-tag
        uses: Drill4J/semver-tag-action@v0.2.0
        with:
          type: ${{ github.ref_name == 'main' && 'patch' || 'prerelease' }}

      - id: version
        run: |
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid chart version: $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
        env:
          tag: ${{ inputs.version != null && inputs.version || steps.next-tag.outputs.tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set version in Chart.yaml
        run: |
          yq -i ".version = \"$VERSION\"" ./Chart.yaml
          yq -i ".appVersion = \"$VERSION\"" ./Chart.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Lint
        run: helm lint .

      - name: Template check
        run: helm template drill . > /dev/null

      - name: Package
        run: helm package .

      - name: Create tag if needed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD^{commit})" ]; then
              echo "::error::Tag $TAG points to a different commit"
              exit 1
            fi
          else
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Push
        run: helm push "drill-$VERSION.tgz" oci://ghcr.io/drill4j
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release upload "$TAG" "drill-$VERSION.tgz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$TAG" "drill-$VERSION.tgz" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Release $TAG" \
              --notes "Helm chart $VERSION" \
              "${prerelease[@]}"
          fi
